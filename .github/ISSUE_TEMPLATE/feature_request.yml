name: Feature request
description: Propose a new capability or methodology improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What SEO or engineering problem would this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the capability, expected evidence, and user-facing output.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations or risks
      description: Note methodology, crawl-safety, privacy, or interpretation concerns.
